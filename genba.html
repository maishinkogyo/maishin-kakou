<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイシン工業 現場管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-gate.js"></script>
<script src="js/maishin-supabase.js"></script>
<script src="maishin-nav.js"></script>
<script src="maishin-pdf-menu.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maishin-theme.css">
<link rel="stylesheet" href="maishin-entrance.css">
<style>
/* 配色は maishin-theme.css */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}

#app{display:block;max-width:100%;overflow-x:hidden;}
.layout{display:flex;min-height:100vh;max-width:100%;min-width:0;}
/* サイドメニュー: maishin-theme.css (.ms-sidebar) */
.sidebar:not(.ms-sidebar){width:var(--sidebar-w);}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);text-align:left;transition:all .15s;}
.nav-btn:hover{background:var(--surface2);color:var(--text);}
.mobile-more-panel .nav-btn.active{background:var(--accent-light);color:var(--accent);font-weight:700;}
.main-content{margin-left:var(--sidebar-w);flex:1;min-width:0;max-width:100%;padding:24px;overflow-x:hidden;}
.page{display:none;max-width:100%;min-width:0;}
.page.active{display:block;}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.page-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px;}

.card{background:var(--surface);border:1.5px solid var(--ms-navy-border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}

.site-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .15s;}
.site-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.08);}
.site-name{font-size:15px;font-weight:700;}
.site-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}
.badge.green{background:#dcfce7;color:#16a34a;border-color:#86efac;}
.badge.amber{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.badge.red{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
.badge.blue{background:#dbeafe;color:#2563eb;border-color:#93c5fd;}
.badge.purple{background:#f3e8ff;color:#9333ea;border-color:#d8b4fe;}

.site-status-tag{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;white-space:nowrap;
}
.site-status-tag.tag-overdue{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
.site-status-tag.tag-urgent{background:#fef9c3;color:#a16207;border:1px solid #fde047;}
.site-status-tag.tag-normal{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd;}

.gbar-field{
  background:repeating-linear-gradient(-45deg,rgba(22,163,74,.22) 0,rgba(22,163,74,.22) 5px,rgba(22,163,74,.42) 5px,rgba(22,163,74,.42) 10px);
  border:1px solid rgba(22,163,74,.55);box-sizing:border-box;
}
.gbar-field-overdue{
  background:repeating-linear-gradient(-45deg,rgba(220,38,38,.18) 0,rgba(220,38,38,.18) 5px,rgba(220,38,38,.38) 5px,rgba(220,38,38,.38) 10px);
  border:1px solid rgba(220,38,38,.55);
}
.gantt-field-hint{
  font-size:9px;font-weight:700;color:#b45309;background:#fffbeb;border:1px solid #fde047;
  border-radius:4px;padding:1px 5px;flex-shrink:0;white-space:nowrap;
}
.legend-dot-field{
  display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:middle;
  background:repeating-linear-gradient(-45deg,rgba(22,163,74,.35) 0,rgba(22,163,74,.35) 3px,rgba(22,163,74,.6) 3px,rgba(22,163,74,.6) 6px);
  border:1px solid rgba(22,163,74,.5);
}

.progress-wrap{margin-top:10px;}
.unit-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.unit-tab{padding:4px 10px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;}
.unit-tab:hover{border-color:var(--accent);color:var(--text);}
.unit-tab.active{border-color:var(--accent);background:rgba(22,163,74,.12);color:var(--accent);font-weight:600;}
.unit-tab.none-tab.active{border-color:var(--border);background:var(--surface2);color:var(--text-muted);font-weight:400;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.progress-bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.site-toolbar-block{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.site-toolbar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.site-search-input{
  flex:1;min-width:140px;max-width:280px;padding:8px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;background:var(--surface);
}
.site-situation-filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.site-situation-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-right:2px;}
.status-filter-btn{
  padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface2);
  font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;
}
.status-filter-btn:hover{border-color:var(--accent);color:var(--text);}
.status-filter-btn.active{border-color:var(--accent);background:rgba(22,163,74,.12);color:var(--accent);}
.spacer{flex:1;}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--ms-accent-hover);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:#fee2e2;color:var(--danger);border:1px solid #fca5a5;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
.form-group label{font-size:12px;font-weight:600;color:var(--text-muted);}
.form-group input,.form-group select,.form-group textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color .2s;background:var(--surface);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:64px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;border-bottom:2px solid var(--border);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--accent-light);color:var(--accent);border-radius:20px;font-size:12px;font-weight:600;margin:2px;}
.chip-remove{cursor:pointer;opacity:.6;line-height:1;}
.chip-remove:hover{opacity:1;}
.worker-toggle{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;margin:3px;}
.worker-toggle.assigned{background:var(--accent-light);color:var(--accent);border:1px solid #86efac;}
.worker-toggle.assigned:hover{background:#bbf7d0;}
.worker-toggle.unassigned{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}
.worker-toggle.unassigned:hover{background:#e2e8f0;color:var(--text);}
.assign-banner{border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
/* 配置表：親は画面幅固定・表だけ横スクロール */
#assignPane-grid{max-width:100%;min-width:0;}
#assignBoard{
  display:block;width:100%;max-width:100%;min-width:0;
  overflow-x:auto;overflow-y:visible;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--border);border-radius:8px;background:var(--surface);
}
#assignBoard .assign-table-wrap{display:block;width:max-content;}
.assign-scroll-hint{display:none;font-size:12px;color:var(--text-muted);margin:0 0 8px;}
.assign-grid-table{border-collapse:collapse;font-size:12px;}
.assign-grid-table .col-site{width:124px;min-width:120px;max-width:140px;word-break:break-word;line-height:1.35;}
.assign-grid-table .col-day{width:140px;min-width:140px;max-width:140px;vertical-align:top;padding:8px 6px!important;}
.assign-grid-table .col-day .assign-chip{display:inline-block;border-radius:4px;font-size:11px;padding:2px 7px;margin:2px 2px;box-sizing:border-box;vertical-align:top;}
.assign-grid-table .assign-vehicle-chip{background:#f3e8ff;color:#9333ea;white-space:nowrap;max-width:100%;}
.assign-grid-table td.assign-unused-cell .assign-vehicle-chip{display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:top;}
.assign-grid-table td:not(.assign-unused-cell) .assign-vehicle-chip{display:block;overflow:hidden;text-overflow:ellipsis;}
.assign-grid-table td.assign-unused-cell{cursor:pointer;}
#page-assign{max-width:100%;min-width:0;overflow-x:hidden;}
.toolbar-week{align-items:center;}
.toolbar-week .assign-week-label{flex:1;text-align:center;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-value{font-size:22px;font-weight:800;color:var(--text);}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}

.empty{text-align:center;padding:40px;color:var(--text-muted);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:8px;}

#flash{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9000;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:min(420px,calc(100vw - 32px));line-height:1.45;}
#flash.flash-error{background:var(--danger)!important;}
#cloudWarn{display:none;background:#fef2f2;border-bottom:1px solid #fecaca;color:#991b1b;padding:10px 16px;font-size:13px;font-weight:600;text-align:center;position:fixed;top:0;left:0;right:0;z-index:9990;box-shadow:0 2px 8px rgba(0,0,0,.08);}
#cloudWarn.visible{display:block;}
body.cloud-warn-active .layout{padding-top:44px;}
/* タイムスケジュール */
.nippo-tab{padding:8px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
.nippo-tab:hover{color:var(--text);}
.nippo-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tl-wrap{display:flex;overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
.tl-axis{flex-shrink:0;width:46px;border-right:1px solid var(--border);}
.tl-axis-header{height:42px;border-bottom:1px solid var(--border);background:var(--surface2);}
.tl-hour-mark{height:60px;font-size:10px;color:var(--text-muted);display:flex;align-items:flex-start;padding:3px 4px 0;border-top:1px solid var(--border);box-sizing:border-box;}
.tl-col{flex:1;min-width:120px;display:flex;flex-direction:column;border-right:1px solid var(--border);}
.tl-col:last-child{border-right:none;}
.tl-col-name{height:42px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text);border-bottom:1px solid var(--border);padding:0 4px;text-align:center;background:var(--surface2);}
.tl-track{flex:1;position:relative;background:#f8fafc;}
.tl-hour-line{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none;}
.tl-block{position:absolute;left:3px;right:3px;border-radius:5px;padding:4px 6px;font-size:11px;font-weight:600;color:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2);line-height:1.4;box-sizing:border-box;cursor:default;}
.tl-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.tl-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text);}

.cat-材料費{background:#dbeafe;color:#2563eb;border-color:#93c5fd;}
.cat-外注費{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.cat-人件費{background:#f3e8ff;color:#9333ea;border-color:#d8b4fe;}
.cat-その他{background:var(--surface2);color:var(--text-muted);border-color:var(--border);}

/* スマホ・タブレット縦：画面下メニュー（PC幅では非表示） */
.mobile-bottom-nav{display:none !important;}
.mobile-more-sheet{display:none;}

@media(max-width:900px){
  :root{--sidebar-w:0px;--mobile-nav-h:60px;}
  .sidebar{display:none !important;}
  .main-content{margin-left:0!important;padding:12px 12px calc(var(--mobile-nav-h) + 16px);}
  .page-title{font-size:18px;}
  .btn{min-height:44px;padding:10px 16px;font-size:14px;}
  .btn-sm{min-height:40px;padding:8px 12px;font-size:13px;}
  .nav-btn{min-height:44px;padding:12px 14px;font-size:14px;}
  input,select,textarea{font-size:16px;}
  .form-row{flex-direction:column;}
  .form-group{min-width:0!important;width:100%;flex:1 1 100%;}
  .toolbar:not(.toolbar-week){align-items:stretch;}
  .toolbar:not(.toolbar-week) .btn,.toolbar:not(.toolbar-week) select{width:100%;}
  .toolbar .spacer{display:none;}
  .toolbar-week{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px;}
  .toolbar-week .assign-week-label{flex:1 1 100%;width:100%;text-align:center;font-size:15px;margin:0 0 4px;}
  .toolbar-week .btn{flex:1;min-width:0;max-width:calc(33% - 6px);width:auto!important;}
  #page-assign .tab-row{display:flex;gap:0;}
  #page-assign .tab-row .nippo-tab{flex:1;text-align:center;padding:10px 6px;font-size:12px;white-space:nowrap;}
  #cellAssignLayout{flex-direction:column;}
  .assign-scroll-hint{display:block;}
  /* スマホ：現場名+約2日分が一画面に収まるよう調整（現場名のみ+1文字分広め） */
  #assignBoard .assign-grid-table .col-site{width:120px;min-width:120px;max-width:120px;font-size:12px;}
  #assignBoard .assign-grid-table .col-day{width:128px;min-width:128px;max-width:128px;padding:6px 5px!important;}
  #assignBoard .assign-grid-table th:first-child,
  #assignBoard .assign-grid-table td:first-child{
    position:sticky;left:0;z-index:2;
    box-shadow:4px 0 8px rgba(0,0,0,.08);
  }
  #assignBoard .assign-grid-table thead th:first-child{z-index:4;background:var(--surface2)!important;}
  #assignBoard .assign-grid-table thead th.col-site{z-index:5;}
  #assignBoard .assign-grid-table tbody td.col-site{background:var(--surface)!important;z-index:3;}
  #assignBoard .assign-grid-table tbody tr:nth-child(even) td.col-site{background:#fafbfc!important;}
  #siteList{grid-template-columns:1fr!important;}
  .site-card{padding:14px;}
  .modal-overlay{padding:8px;align-items:flex-end;}
  .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:92vh;padding:18px 16px;}
  .modal-footer{flex-wrap:wrap;}
  .modal-footer .btn{flex:1;min-width:120px;}
  .data-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  #flash,#ld{bottom:calc(var(--mobile-nav-h) + 12px);}
  .mobile-bottom-nav{
    display:flex !important;visibility:visible !important;
    position:fixed;left:0;right:0;bottom:0;height:var(--mobile-nav-h);
    background:var(--surface);border-top:1px solid var(--border);
    z-index:500;box-shadow:0 -4px 20px rgba(0,0,0,.08);
    padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0);
  }
  .mbn-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;border:none;background:none;color:var(--text-muted);
    font-size:10px;font-weight:600;padding:6px 2px;cursor:pointer;
    min-height:var(--mobile-nav-h);-webkit-tap-highlight-color:transparent;
  }
  .mbn-item span.mbn-icon{font-size:20px;line-height:1;}
  .mbn-item.active{color:var(--accent);}
  .mbn-item.active .mbn-icon{transform:scale(1.05);}
  .mobile-more-sheet{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250;
    align-items:flex-end;justify-content:center;
  }
  .mobile-more-sheet.open{display:flex;}
  .mobile-more-panel{
    background:var(--surface);border-radius:16px 16px 0 0;width:100%;
    max-width:480px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));
    box-shadow:0 -8px 32px rgba(0,0,0,.15);
  }
}

/* JSフォールバック（メディアクエリが効かない環境用） */
body.genba-mobile .sidebar{display:none !important;}
body.genba-mobile .main-content{margin-left:0!important;padding-bottom:calc(var(--mobile-nav-h,60px) + 16px);}
body.genba-mobile .mobile-bottom-nav{
  display:flex !important;visibility:visible !important;
  position:fixed;left:0;right:0;bottom:0;z-index:500;
  height:var(--mobile-nav-h,60px);background:var(--surface);
  border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(0,0,0,.08);
}
body.genba-mobile .mbn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;border:none;background:none;color:var(--text-muted);
  font-size:10px;font-weight:600;min-height:var(--mobile-nav-h,60px);cursor:pointer;
  font-family:inherit;
}
body.genba-mobile .mbn-item.active{color:var(--accent);}
body.genba-mobile .mobile-more-sheet.open{display:flex !important;}
body.genba-mobile .toolbar:not(.toolbar-week) .btn,
body.genba-mobile .toolbar:not(.toolbar-week) select{width:100%;}
body.genba-mobile .toolbar-week .assign-week-label{width:100%;text-align:center;}
body.genba-mobile .toolbar-week .btn{flex:1;width:auto!important;max-width:33%;}
body.genba-mobile #assignBoard{width:100%;max-width:100%;min-width:0;overflow-x:auto;}
body.genba-mobile .main-content,#app,.layout{overflow-x:hidden;max-width:100%;min-width:0;}
</style>
</head>
<body class="maishin-auth-pending ms-theme">
<script>MaishinAuth.bootPage();</script>

<div id="cloudWarn" role="alert"></div>

<div id="maishinAuthGate">
  <div class="maishin-auth-card">
    <p class="maishin-auth-eyebrow">Maishin Kogyo</p>
    <div class="maishin-auth-divider"></div>
    <p>ログインが必要です。<br>玄関（ログイン画面）から入り直してください。</p>
    <a id="maishinAuthGateLink" data-maishin-home href="index.html">玄関へ</a>
  </div>
</div>

<div id="app" style="display:block">
  <div class="layout">
    <nav class="sidebar ms-sidebar" aria-label="メインメニュー">
      <div class="sidebar-logo ms-sidebar-brand">
        <div class="logo-main ms-sidebar-brand-title">マイシン工業</div>
        <div class="logo-sub ms-sidebar-brand-sub">管理システム</div>
      </div>
