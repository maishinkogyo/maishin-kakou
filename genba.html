<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイシン工業 現場管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--accent:#16a34a;--accent-light:#dcfce7;--bg:#f8fafc;--surface:#fff;--surface2:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--text-muted:#64748b;--danger:#ef4444;--warn:#f59e0b;--sidebar-w:200px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}

#lockScreen{position:fixed;inset:0;background:linear-gradient(135deg,#14532d,#166534,#15803d);display:flex;align-items:center;justify-content:center;z-index:9999;}
.lock-card{background:#fff;border-radius:16px;padding:40px 32px;width:340px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.lock-logo{font-size:26px;font-weight:800;color:var(--accent);margin-bottom:4px;}
.lock-sub{font-size:12px;color:var(--text-muted);margin-bottom:20px;}
.lock-card input{width:100%;padding:12px 40px 12px 16px;border:2px solid var(--border);border-radius:8px;font-size:16px;outline:none;transition:border-color .2s;}
.lock-card input:focus{border-color:var(--accent);}
.lock-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;margin-top:12px;}
.lock-btn:hover{background:#15803d;}
#lockError{color:var(--danger);font-size:12px;margin-top:8px;min-height:16px;}

#app{display:none;}
.layout{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
.logo-main{font-size:13px;font-weight:800;color:var(--accent);}
.logo-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
.sidebar-nav{flex:1;padding:8px;overflow-y:auto;}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);text-align:left;transition:all .15s;}
.nav-btn:hover{background:var(--surface2);color:var(--text);}
.nav-btn.active{background:var(--accent-light);color:var(--accent);font-weight:700;}
.sidebar-footer{padding:12px 8px;border-top:1px solid var(--border);}
.main-content{margin-left:var(--sidebar-w);flex:1;padding:24px;max-width:1100px;}
.page{display:none;}
.page.active{display:block;}
.page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.page-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}

.site-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .15s;}
.site-card:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.08);}
.site-name{font-size:15px;font-weight:700;}
.site-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.badge{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}
.badge.green{background:#dcfce7;color:#16a34a;border-color:#86efac;}
.badge.amber{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.badge.red{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
.badge.blue{background:#dbeafe;color:#2563eb;border-color:#93c5fd;}
.badge.purple{background:#f3e8ff;color:#9333ea;border-color:#d8b4fe;}

.progress-wrap{margin-top:10px;}
.unit-tabs{display:flex;gap:4px;flex-wrap:wrap;}
.unit-tab{padding:4px 10px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text-muted);font-size:12px;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;}
.unit-tab:hover{border-color:var(--accent);color:var(--text);}
.unit-tab.active{border-color:var(--accent);background:rgba(22,163,74,.12);color:var(--accent);font-weight:600;}
.unit-tab.none-tab.active{border-color:var(--border);background:var(--surface2);color:var(--text-muted);font-weight:400;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-bottom:4px;}
.progress-bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.spacer{flex:1;}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:#15803d;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:#fee2e2;color:var(--danger);border:1px solid #fca5a5;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
.form-group label{font-size:12px;font-weight:600;color:var(--text-muted);}
.form-group input,.form-group select,.form-group textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color .2s;background:var(--surface);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}
.form-group textarea{resize:vertical;min-height:64px;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;border-bottom:2px solid var(--border);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--accent-light);color:var(--accent);border-radius:20px;font-size:12px;font-weight:600;margin:2px;}
.chip-remove{cursor:pointer;opacity:.6;line-height:1;}
.chip-remove:hover{opacity:1;}
.worker-toggle{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;user-select:none;margin:3px;}
.worker-toggle.assigned{background:var(--accent-light);color:var(--accent);border:1px solid #86efac;}
.worker-toggle.assigned:hover{background:#bbf7d0;}
.worker-toggle.unassigned{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);}
.worker-toggle.unassigned:hover{background:#e2e8f0;color:var(--text);}
.assign-banner{border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.wl-tab{padding:8px 18px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;}
.wl-tab:hover{color:var(--text);}
.wl-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.stat-value{font-size:22px;font-weight:800;color:var(--text);}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:2px;}

.empty{text-align:center;padding:40px;color:var(--text-muted);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:8px;}

#flash{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9000;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15);}

.cat-材料費{background:#dbeafe;color:#2563eb;border-color:#93c5fd;}
.cat-外注費{background:#fef3c7;color:#d97706;border-color:#fcd34d;}
.cat-人件費{background:#f3e8ff;color:#9333ea;border-color:#d8b4fe;}
.cat-その他{background:var(--surface2);color:var(--text-muted);border-color:var(--border);}

@media(max-width:640px){
  :root{--sidebar-w:0px;}
  .sidebar{display:none;}
  .main-content{margin-left:0;padding:16px;}
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">マイシン工業</div>
    <div class="lock-sub">現場管理システム</div>
    <div style="position:relative">
      <input type="password" id="lockInput" placeholder="パスワード" onkeydown="if(event.key==='Enter')tryUnlock()">
      <button onclick="togglePw()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-muted)" id="eyeBtn">👁</button>
    </div>
    <div id="lockError"></div>
    <button class="lock-btn" onclick="tryUnlock()">ログイン</button>
    <div id="lockHint" style="font-size:12px;color:var(--text-muted);margin-top:12px"></div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-main">マイシン工業</div>
        <div class="logo-sub">現場管理システム</div>
      </div>
      <div class="sidebar-nav">
        <button class="nav-btn active" onclick="showPage('sites')" id="nav-sites"><span>🏗️</span> 現場一覧</button>
        <button class="nav-btn" onclick="showPage('worklog')" id="nav-worklog"><span>📝</span> 作業日報</button>
        <button class="nav-btn" onclick="showPage('assign')" id="nav-assign"><span>👷</span> 人員配置</button>
        <button class="nav-btn" onclick="showPage('costs')" id="nav-costs"><span>💰</span> 原価管理</button>
        <button class="nav-btn" onclick="showPage('settings')" id="nav-settings"><span>⚙️</span> 設定</button>
      </div>
      <div class="sidebar-footer">
        <button class="nav-btn" onclick="lockApp()"><span>🔒</span> ロック</button>
      </div>
    </nav>

    <main class="main-content">

      <!-- 現場一覧 -->
      <div class="page active" id="page-sites">
        <div class="page-title">現場一覧</div>
        <div class="page-desc">進行中の工事・現場の状況</div>
        <div class="toolbar">
          <select id="siteFilter" onchange="renderSites()" class="btn btn-secondary" style="font-weight:500">
            <option value="active">進行中</option>
            <option value="all">すべて</option>
            <option value="complete">完了済</option>
          </select>
          <div class="spacer"></div>
          <button class="btn btn-primary" onclick="openSiteModal()">＋ 現場追加</button>
        </div>
        <div id="siteList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-items:start"></div>
      </div>

      <!-- 作業日報 -->
      <div class="page" id="page-worklog">
        <div class="page-title">作業日報</div>
        <!-- タブ -->
        <div style="display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border);padding-bottom:0">
          <button class="wl-tab active" id="wlTab-list" onclick="switchWlTab('list')">📋 一覧</button>
          <button class="wl-tab" id="wlTab-summary" onclick="switchWlTab('summary')">📊 集計</button>
        </div>
        <!-- 一覧 -->
        <div id="wlPane-list">
          <div class="toolbar">
            <div class="form-group" style="min-width:220px;margin:0">
              <select id="wlTaskSel" onchange="renderWorklog()">
                <option value="">現場を選択…</option>
              </select>
            </div>
            <div class="spacer"></div>
            <button class="btn btn-primary" onclick="openWorklogModal()">＋ 記録追加</button>
          </div>
          <div id="worklogList"></div>
        </div>
        <!-- 集計 -->
        <div id="wlPane-summary" style="display:none">
          <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
            <button class="btn btn-secondary btn-sm" id="wlSumBtn-day" onclick="switchWlSummary('day')" style="background:var(--accent);color:#fff">日別</button>
            <button class="btn btn-secondary btn-sm" id="wlSumBtn-site" onclick="switchWlSummary('site')">現場別</button>
          </div>
          <div id="wlSummaryContent"></div>
        </div>
      </div>

      <!-- 人員配置 -->
      <div class="page" id="page-assign">
        <div class="page-title">人員配置</div>
        <div class="toolbar" style="justify-content:space-between;align-items:center">
          <button class="btn btn-secondary btn-sm" onclick="weekOffset--;renderAssign()">← 前週</button>
          <span id="assignWeekLabel" style="font-weight:700;font-size:14px"></span>
          <div style="display:flex;gap:6px">
            <button class="btn btn-secondary btn-sm" onclick="weekOffset=0;renderAssign()">今週</button>
            <button class="btn btn-secondary btn-sm" onclick="weekOffset++;renderAssign()">次週 →</button>
          </div>
        </div>
        <div id="assignBanner" style="margin-top:8px"></div>
        <div id="assignBoard" style="overflow-x:auto"></div>
      </div>

      <!-- 原価管理 -->
      <div class="page" id="page-costs">
        <div class="page-title">原価管理</div>
        <div class="page-desc">現場ごとの費用を記録・集計</div>
        <div class="toolbar">
          <div class="form-group" style="min-width:220px;margin:0">
            <select id="costTaskSel" onchange="renderCosts()">
              <option value="">現場を選択…</option>
            </select>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-primary" onclick="openCostModal()">＋ 費用追加</button>
        </div>
        <div id="costStats"></div>
        <div id="costList"></div>
      </div>

      <!-- 設定 -->
      <div class="page" id="page-settings">
        <div class="page-title">設定</div>
        <div class="page-desc"></div>

        <div class="card" style="margin-bottom:20px">
          <div class="card-title">作業員マスタ</div>
          <div class="toolbar" style="margin-bottom:12px">
            <div class="spacer"></div>
            <button class="btn btn-primary btn-sm" onclick="openWorkerModal()">＋ 追加</button>
          </div>
          <div id="workerList"></div>
        </div>


        <div class="card">
          <div class="card-title">パスワード変更</div>
          <div class="form-row">
            <div class="form-group"><label>現在のパスワード</label><input type="password" id="pwCurrent"></div>
            <div class="form-group"><label>新しいパスワード</label><input type="password" id="pwNew"></div>
            <div class="form-group"><label>確認</label><input type="password" id="pwConfirm"></div>
          </div>
          <button class="btn btn-primary btn-sm" onclick="changePw()">変更する</button>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- 現場詳細モーダル -->
<!-- 人員配置セルモーダル -->
<div class="modal-overlay" id="cellAssignModal">
  <div class="modal" style="max-width:320px">
    <div class="modal-title" id="cellAssignTitle"></div>
    <div id="cellAssignWorkers" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('cellAssignModal')">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="siteDetailModal" style="z-index:600">
  <div class="modal" style="max-width:640px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px">
      <div style="flex:1">
        <div style="font-size:18px;font-weight:800;color:var(--text)" id="sdTitle"></div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:2px" id="sdSub"></div>
      </div>
      <button onclick="closeModal('siteDetailModal')" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-muted);padding:0 4px;line-height:1">✕</button>
    </div>
    <div id="sdBadges" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:4px">
        <span>進捗</span><span id="sdPct" style="font-weight:700;color:var(--accent)"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="sdProgressFill"></div></div>
    </div>

    <div style="background:var(--surface2,#f8fafc);border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:10px">📋 今日の進捗を入力</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        <div class="form-group" style="margin:0;min-width:130px"><label>日付</label><input type="date" id="sdDate"></div>
        <div class="form-group" style="margin:0;width:110px"><label>完了kg数</label><input type="number" id="sdKg" min="0" placeholder="完了kg数"></div>
        <div class="form-group" style="margin:0;flex:1;min-width:120px"><label>メモ（任意）</label><input type="text" id="sdNote" placeholder="任意"></div>
        <button class="btn btn-primary btn-sm" style="margin-bottom:1px" onclick="saveSiteDetailRecord()">＋ 追加</button>
      </div>
    </div>

    <div id="sdRecordList" style="max-height:300px;overflow-y:auto;margin-bottom:16px"></div>

    <div class="modal-footer" style="padding-top:12px;border-top:1px solid var(--border)">
      <button class="btn btn-secondary btn-sm" onclick="openSiteModalFromDetail()">✏️ 現場情報を編集</button>
      <button class="btn btn-sm" id="sdCompleteBtn" onclick="toggleSiteCompleteFromDetail()"></button>
      <button class="btn btn-danger btn-sm" onclick="deleteSiteFromDetail()">🗑 削除</button>
      <div class="spacer"></div>
      <button class="btn btn-secondary" onclick="closeModal('siteDetailModal')">閉じる</button>
    </div>
  </div>
</div>

<!-- 現場モーダル -->
<div class="modal-overlay" id="siteModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-title" id="siteModalTitle">現場追加</div>
    <input type="hidden" id="siteId">
    <div class="form-row">
      <div class="form-group"><label>メイン項目</label><input type="text" id="siteName" placeholder="例：米子体育館"></div>
      <div class="form-group"><label>サブ項目（任意）</label><input type="text" id="siteNameSub" placeholder="例：２階"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>部門</label>
        <select id="siteDept">
          <option value="">未設定</option>
          <option value="建築">建築</option>
          <option value="土木">土木</option>
          <option value="住宅基礎">住宅基礎</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="form-group"><label>優先度</label>
        <select id="sitePriority">
          <option value="1">1（高）</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>総kg数</label><input type="number" id="siteTotalKg" min="0" placeholder="0"></div>
      <div class="form-group"><label>材料名</label><input type="text" id="siteMaterial" placeholder="例：SUS304"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>開始日</label><input type="date" id="siteStart"></div>
      <div class="form-group"><label>納期</label><input type="date" id="siteDeadline"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>作業者</label>
        <select id="siteWorker"><option value="">未割当</option></select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:8px">
      <label>ユニット</label>
      <div class="unit-tabs" id="siteUnitTabs">
        <span class="unit-tab none-tab active" onclick="selectSiteUnitTab('none',this)">なし</span>
        <span class="unit-tab" onclick="selectSiteUnitTab('full',this)">マイシングレード</span>
        <span class="unit-tab" onclick="selectSiteUnitTab('outer',this)">外周のみ</span>
        <span class="unit-tab" onclick="selectSiteUnitTab('other',this)">その他ユニット</span>
      </div>
      <input type="hidden" id="siteUnitType" value="none">

<script>
const SB_URL='https://eejudrgbzemtzzsffrgg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlanVkcmdiemVtdHp6c2ZmcmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3ODU2MDksImV4cCI6MjA5MDM2MTYwOX0.ILiz-E7j_ZW52o0HHPxARGEUfUaXJ_-yDUFfBne2Fsc';
const sb=supabase.createClient(SB_URL,SB_KEY);

let tasks=[],fieldWorkers=[],assignments=[],workRecords=[],costs=[];
let editingWlId=null,editingCostId=null,editingWrkId=null;

// ── Auth ──
const PW_KEY='genba_pw';
const PW_DEFAULT='1234';
let lockFailCount=0,lockUntil=0;

function hashPw(pw){let h=0;for(let i=0;i<pw.length;i++){h=Math.imul(31,h)+pw.charCodeAt(i)|0;}return h.toString(36)+'_'+pw.length;}
function getStoredHash(){return localStorage.getItem(PW_KEY)||hashPw(PW_DEFAULT);}

function tryUnlock(){
  const now=Date.now();
  if(lockUntil>now){document.getElementById('lockError').textContent=`ロック中。${Math.ceil((lockUntil-now)/1000)}秒後に再試行`;return;}
  const pw=document.getElementById('lockInput').value;
  if(!pw){document.getElementById('lockError').textContent='パスワードを入力してください';return;}
  if(hashPw(pw)===getStoredHash()){
    lockFailCount=0;
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('lockInput').value='';
    document.getElementById('lockError').textContent='';
    document.getElementById('app').style.display='block';
    initApp();
  }else{
    lockFailCount++;
    if(lockFailCount>=5)lockUntil=Date.now()+30000;
    document.getElementById('lockError').textContent=`パスワードが違います（${lockFailCount}回目）`;
  }
}
function lockApp(){document.getElementById('app').style.display='none';document.getElementById('lockScreen').style.display='flex';document.getElementById('lockInput').value='';}
function togglePw(){const i=document.getElementById('lockInput'),b=document.getElementById('eyeBtn');if(i.type==='password'){i.type='text';b.textContent='🙈';}else{i.type='password';b.textContent='👁';}}
function changePw(){
  const cur=document.getElementById('pwCurrent').value,nw=document.getElementById('pwNew').value,cf=document.getElementById('pwConfirm').value;
  if(hashPw(cur)!==getStoredHash()){alert('現在のパスワードが違います');return;}
  if(nw.length<4){alert('4文字以上で設定してください');return;}
  if(nw!==cf){alert('新しいパスワードが一致しません');return;}
  localStorage.setItem(PW_KEY,hashPw(nw));
  alert('パスワードを変更しました');
  ['pwCurrent','pwNew','pwConfirm'].forEach(id=>document.getElementById(id).value='');
}

// ── Init ──
async function initApp(){
  showLoading();
  weekOffset=0;
  try{
    const[t,fw,asg,wr,c]=await Promise.all([
      sb.from('genba_tasks').select('*').order('num'),
      sb.from('field_workers').select('*').order('name'),
      sb.from('field_assignments').select('*'),
      sb.from('field_work_records').select('*').order('date',{ascending:false}),
      sb.from('field_costs').select('*').order('date',{ascending:false}),
    ]);
    const kgMap=loadKgMap();
    tasks=(t.data||[]).map(x=>({...x,nameMain:x.name_main||'',nameSub:x.name_sub||'',total_kg:kgMap[x.id]||0}));
    fieldWorkers=fw.data||[];
    assignments=asg.data||[];
    workRecords=wr.data||[];
    costs=c.data||[];
  }catch(e){console.error(e);}
  hideLoading();
  populateSelects();
  renderSites();
  renderWorklog();
  renderAssign();
  renderCosts();
  renderWorkers();
}

// ── Helpers ──
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function taskName(t){return t.nameMain+(t.nameSub?' ／ '+t.nameSub:'');}
function fmt(d){return d?d.replace(/-/g,'/'):'－';}
function fmtMoney(n){return'¥'+Number(n).toLocaleString();}

function populateSelects(){
  const active=tasks.filter(t=>!t.complete);
  ['wlTaskSel','costTaskSel'].forEach(id=>{
    const sel=document.getElementById(id),prev=sel.value;
    sel.innerHTML='<option value="">現場を選択…</option>'+active.map(t=>`<option value="${t.id}">${taskName(t)}</option>`).join('');
    if(prev)sel.value=prev;
  });
}

function cumulativeKg(tid){
  return workRecords.filter(x=>x.task_id===tid).reduce((s,r)=>s+Number(r.progress||0),0);
}
function latestProgress(tid){
  const totalKg=getTaskKg(tid);
  if(totalKg>0) return Math.min(100,Math.round(cumulativeKg(tid)/totalKg*100));
  // total_kg未設定の場合は最新レコードをそのまま%として扱う
  const r=workRecords.filter(x=>x.task_id===tid).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  return r.length?Math.min(100,r[0].progress):0;
}
function latestRecord(tid){
  const r=workRecords.filter(x=>x.task_id===tid).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  return r.length?r[0]:null;
}
function assignedWorkers(tid,date){
  return assignments.filter(a=>a.task_id===tid&&a.date===date).map(a=>fieldWorkers.find(w=>w.id===a.worker_id)).filter(Boolean);
}
function totalCost(tid){return costs.filter(c=>c.task_id===tid).reduce((s,c)=>s+Number(c.amount),0);}
function deadlineCls(dl){
  if(!dl)return'';
  const days=Math.ceil((new Date(dl)-new Date())/(864e5));
  return days<0?'red':days<=7?'amber':'green';
}

function daysLeftSite(dl){return dl?Math.ceil((new Date(dl)-new Date())/864e5):null;}
function calcSitePri(t){
  const p=getTaskMeta(t.id).priority;
  if(p)return Number(p);
  const n=daysLeftSite(t.deadline);
  const pct=getTaskKg(t.id)>0?cumulativeKg(t.id)/getTaskKg(t.id):0;
  if(n!==null&&n<0)return 1;
  if(n!==null&&n<=3)return 2;
  if(pct<0.3)return 2;
  return 3;
}

// ── 現場一覧 ──
function renderSites(){
  const filter=document.getElementById('siteFilter').value;
  let list=tasks;
  if(filter==='active')list=tasks.filter(t=>!t.complete);
  if(filter==='complete')list=tasks.filter(t=>t.complete);
  // 加工アプリと同じ並び順：優先度→納期
  list=[...list].sort((a,b)=>{
    const pa=calcSitePri(a),pb=calcSitePri(b);
    if(pa!==pb)return pa-pb;
    return(daysLeftSite(a.deadline)??9999)-(daysLeftSite(b.deadline)??9999);
  });
  const td=todayStr();
  if(!list.length){
    document.getElementById('siteList').innerHTML='<div class="empty"><div class="empty-icon">🏗️</div>現場データがありません</div>';
    return;
  }
  document.getElementById('siteList').innerHTML=list.map(t=>{
    const prog=latestProgress(t.id),ws=assignedWorkers(t.id,td),cost=totalCost(t.id);
    const totalKg=getTaskKg(t.id);
    const completedKg=cumulativeKg(t.id);
    const meta=getTaskMeta(t.id);
    // 超過日数
    let overdueDays=0;
    if(t.deadline&&!t.complete){
      overdueDays=Math.ceil((new Date()-new Date(t.deadline))/864e5);
      if(overdueDays<0)overdueDays=0;
    }
    // バー色
    const barColor=prog>=100?'#10b981':'linear-gradient(90deg,#6366f1,#8b5cf6)';
    return`<div class="site-card" style="cursor:default;${t.complete?'opacity:.75':''}">
      <!-- 上段: No / 作業員数 / ステータス / 編集 -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--text-muted);font-weight:600">No.${t.num||'-'}</span>
          ${ws.length?`<span style="font-size:12px;font-weight:800;background:#dbeafe;color:#2563eb;border-radius:6px;padding:2px 9px;border:1px solid #93c5fd">${ws.length}</span>`:''}
          ${overdueDays>0?`<span style="font-size:11px;font-weight:700;background:#fee2e2;color:#dc2626;border-radius:6px;padding:2px 8px;border:1px solid #fca5a5">超過</span>`:''}
          ${t.complete?`<span style="font-size:11px;font-weight:700;background:#dcfce7;color:#16a34a;border-radius:6px;padding:2px 8px;border:1px solid #86efac">完了</span>`:''}
        </div>
        <button class="btn btn-secondary btn-sm" onclick="openSiteModal(${t.id})" style="display:flex;align-items:center;gap:4px">✏️ 編集</button>
      </div>
      <!-- 現場名 -->
      <div style="font-size:19px;font-weight:800;color:var(--text);margin-bottom:10px;cursor:pointer;line-height:1.3" onclick="goToSite(${t.id})">
        ${t.nameMain}${t.nameSub?` ／ ${t.nameSub}`:''}
      </div>
      <!-- バッジ行 -->
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
        ${t.deadline?`<span class="badge ${deadlineCls(t.deadline)}">📅 ${fmt(t.deadline)}</span>`:(t.start_date?`<span class="badge">📅 ${fmt(t.start_date)}</span>`:'')}
        ${overdueDays>0?`<span class="badge red">${overdueDays}日超過</span>`:''}
        ${meta.dept?`<span class="badge">${meta.dept}</span>`:''}
        ${meta.priority?`<span class="badge">優先度${meta.priority}</span>`:''}
        ${meta.material?`<span class="badge blue">${meta.material}</span>`:''}
        ${meta.unitType&&meta.unitType!=='none'?`<span class="badge purple">${meta.unitType==='full'?'マイシングレード':meta.unitType==='outer'?'外周のみ':meta.unitOtherNote||'その他'}</span>`:''}
        ${cost>0?`<span class="badge purple">原価 ${fmtMoney(cost)}</span>`:''}
      </div>
      <!-- 作業員チップ -->
      ${ws.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        ${ws.map(w=>`<span style="background:#f3e8ff;color:#7c3aed;border:1px solid #d8b4fe;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600">👤 ${w.name}</span>`).join('')}
      </div>`:''}
      <!-- kg表示 -->
      ${totalKg>0?`<div style="margin-bottom:8px">
        <span style="font-size:15px;font-weight:700;color:#10b981">${completedKg.toLocaleString()}</span>
        <span style="font-size:13px;color:var(--text-muted);font-weight:600"> / ${totalKg.toLocaleString()} kg</span>
      </div>`:''}
      <!-- プログレスバー -->
      <div style="background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px;cursor:pointer" onclick="goToSite(${t.id})">
        <div style="width:${prog}%;height:100%;background:${barColor};border-radius:6px;transition:width .3s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)">
        <span>${totalKg>0?`${completedKg.toLocaleString()} kg 完了`:'進捗'}</span>
        <span style="font-weight:700;color:${prog>=100?'#10b981':'var(--text-muted)'}">${prog}%</span>
      </div>
    </div>`;
  }).join('');
}

// ── 現場CRUD ──
let editingSiteId=null;
function openSiteModal(id=null){
  editingSiteId=id;
  document.getElementById('siteModalTitle').textContent=id?'現場を編集':'現場追加';
  // 作業者セレクト更新
  const wsel=document.getElementById('siteWorker');
  wsel.innerHTML='<option value="">未割当</option>'+fieldWorkers.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');

async function saveSite(){
  const name_main=document.getElementById('siteName').value.trim();
  if(!name_main){alert('現場名を入力してください');return;}
  const name_sub=document.getElementById('siteNameSub').value.trim();
  const start_date=document.getElementById('siteStart').value||null;
  const deadline=document.getElementById('siteDeadline').value||null;
  const total_kg=Number(document.getElementById('siteTotalKg').value)||0;
  const meta={
    dept:document.getElementById('siteDept').value,
    priority:document.getElementById('sitePriority').value,
    material:document.getElementById('siteMaterial').value.trim(),
    workerId:document.getElementById('siteWorker').value,
    unitType:document.getElementById('siteUnitType').value,
    unitOtherNote:document.getElementById('siteUnitOtherNote').value.trim(),
    saleBuyer:document.getElementById('siteSaleBuyer').value.trim(),
    saleKg:document.getElementById('siteSaleKg').value,
    saleAmount:document.getElementById('siteSaleAmount').value,
  };
  if(editingSiteId){
    const{error}=await sb.from('genba_tasks').update({name_main,name_sub,start_date,deadline}).eq('id',editingSiteId);
    if(error){alert('更新失敗: '+error.message);return;}
    const t=tasks.find(x=>x.id===editingSiteId);
    Object.assign(t,{nameMain:name_main,nameSub:name_sub,name_main,name_sub,start_date,deadline,total_kg});
    setTaskKg(editingSiteId,total_kg);
    setTaskMeta(editingSiteId,meta);
  }else{
    const num=tasks.length?Math.max(...tasks.map(x=>x.num||0))+1:1;
    const{data,error}=await sb.from('genba_tasks').insert({name_main,name_sub,start_date,deadline,complete:false,num}).select().single();
    if(error){alert('追加失敗: '+error.message);return;}
    const newTask={...data,nameMain:data.name_main,nameSub:data.name_sub||'',total_kg};
    tasks.push(newTask);
    setTaskKg(data.id,total_kg);
    setTaskMeta(data.id,meta);
  }
  flash();closeModal('siteModal');populateSelects();renderSites();
}

let detailSiteId=null;

function goToSite(tid){
  detailSiteId=tid;
  const t=tasks.find(x=>x.id===tid);
  const prog=latestProgress(tid);
  const td=todayStr();

  const totalKg=getTaskKg(tid);
  const cumKg=cumulativeKg(tid);
  document.getElementById('sdTitle').textContent=t.nameMain;
  document.getElementById('sdSub').textContent=t.nameSub||'';
  document.getElementById('sdPct').textContent=totalKg>0?`${cumKg.toLocaleString()} / ${totalKg.toLocaleString()} kg（${prog}%）`:prog+'%';
  document.getElementById('sdProgressFill').style.width=prog+'%';

  // バッジ
  const ws=assignedWorkers(tid,td);
  const cost=totalCost(tid);
  const badges=[];
  if(t.start_date) badges.push(`<span class="badge">開始 ${fmt(t.start_date)}</span>`);
  if(t.deadline)   badges.push(`<span class="badge ${deadlineCls(t.deadline)}">期限 ${fmt(t.deadline)}</span>`);
  if(ws.length)    badges.push(`<span class="badge blue">今日 ${ws.length}名</span>`);
  if(cost>0)       badges.push(`<span class="badge purple">原価 ${fmtMoney(cost)}</span>`);
  if(t.complete)   badges.push(`<span class="badge green">完了</span>`);
  document.getElementById('sdBadges').innerHTML=badges.join('');

  // 完了/再開ボタン
  const btn=document.getElementById('sdCompleteBtn');
  btn.textContent=t.complete?'🔄 再開':'✅ 完了にする';
  btn.style.background=t.complete?'#6b7280':'var(--accent)';
  btn.style.color='#fff';

  // 日付デフォルト
  document.getElementById('sdDate').value=td;
  document.getElementById('sdKg').value='';
  document.getElementById('sdNote').value='';

  renderSiteDetailRecords();
  openModal('siteDetailModal');
}

function renderSiteDetailRecords(){
  const recs=workRecords.filter(r=>r.task_id===detailSiteId).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const el=document.getElementById('sdRecordList');
  if(!recs.length){el.innerHTML='<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px">記録がありません</div>';return;}
  el.innerHTML=recs.map((r,i)=>{
    const isLatest=i===0;
    const kg=Number(r.progress||0);
    const dayWorkers=assignments.filter(a=>a.task_id===detailSiteId&&a.date===r.date)
      .map(a=>fieldWorkers.find(w=>w.id===a.worker_id)).filter(Boolean).map(w=>w.name);
    return`<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;background:${isLatest?'var(--surface)':'var(--bg)'};border:1px solid ${isLatest?'var(--accent)':'var(--border)'};border-radius:8px;margin-bottom:5px">

      ${dayWorkers.length?`<span style="font-size:12px;color:#6366f1;white-space:nowrap">⏱ ${dayWorkers.map(w=>w.name).join('・')}</span>`:''}
      ${r.note?`<span style="font-size:12px;color:var(--text-muted);flex:1">${r.note}</span>`:'<span style="flex:1"></span>'}
      <button style="background:none;border:none;cursor:pointer;font-size:16px;color:var(--text-muted);padding:0 2px;line-height:1" onclick="deleteSiteDetailRecord(${r.id})" title="削除">×</button>
    </div>`;
  }).join('');

function renderWorklog(){
  const tid=Number(document.getElementById('wlTaskSel').value),el=document.getElementById('worklogList');
  if(!tid){el.innerHTML='<div class="empty"><div class="empty-icon">📝</div>現場を選択してください</div>';return;}
  const recs=workRecords.filter(r=>r.task_id===tid).sort((a,b)=>b.date.localeCompare(a.date));
  if(!recs.length){el.innerHTML='<div class="empty"><div class="empty-icon">📝</div>記録がありません</div>';return;}
  el.innerHTML=recs.map(r=>{
    let extra={};
    try{extra=JSON.parse(r.note||'{}');}catch(e){}
    const workerName=extra.worker?(fieldWorkers.find(w=>w.id===Number(extra.worker))||{name:extra.worker}).name||extra.worker:'';
    const badges=[];
    if(extra.location)badges.push(`<span class="badge blue">${extra.location}</span>`);
    if(extra.workType&&extra.workType!=='-')badges.push(`<span class="badge">${extra.workType}</span>`);
    if(extra.material)badges.push(`<span class="badge">${extra.material}</span>`);
    if(extra.timeStart||extra.timeEnd)badges.push(`<span class="badge green">⏱ ${extra.timeStart||'?'}〜${extra.timeEnd||'?'}</span>`);
    if(extra.client)badges.push(`<span class="badge amber">${extra.client}</span>`);
    if(extra.car1)badges.push(`<span class="badge">🚗 ${extra.car1}</span>`);
    if(extra.unitPass&&extra.unitPass!=='-')badges.push(`<span class="badge ${extra.unitPass==='○'?'green':'red'}">ユニット ${extra.unitPass}</span>`);
    if(extra.inspection&&extra.inspection!=='-')badges.push(`<span class="badge ${extra.inspection==='○'?'green':'red'}">自主検査 ${extra.inspection}</span>`);
    const stayInfo=[];
    if(extra.stay0Go)stayInfo.push(`通い行${extra.stay0Go}`);
    if(extra.stay0Return)stayInfo.push(`帰${extra.stay0Return}`);
    if(extra.stay1Go)stayInfo.push(`泊行${extra.stay1Go}`);
    if(extra.stay1Return)stayInfo.push(`帰${extra.stay1Return}`);
    if(stayInfo.length)badges.push(`<span class="badge">👷 ${stayInfo.join(' ')}</span>`);
    return`<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:14px;font-weight:700">${fmt(r.date)}</span>
          ${workerName?`<span style="font-size:13px;font-weight:600;color:#7c3aed;background:#f3e8ff;border:1px solid #d8b4fe;border-radius:20px;padding:2px 10px">👤 ${workerName}</span>`:''}
        </div>
        <div style="display:flex;gap:4px">
          <button class="btn btn-secondary btn-sm" onclick="editWorklog(${r.id})">編集</button>
          <button class="btn btn-danger btn-sm" onclick="deleteWorklog(${r.id})">削除</button>
        </div>
      </div>
      ${r.content?`<div style="font-size:13px;color:var(--text);margin-bottom:8px;line-height:1.6">${r.content}</div>`:''}
      ${badges.length?`<div style="display:flex;flex-wrap:wrap;gap:4px">${badges.join('')}</div>`:''}
    </div>`;
  }).join('');
}

// ── 人員配置（週間グリッド） ──
let weekOffset=0;
const DAY_NAMES=['月','火','水','木','金','土','日'];

function localDateStr(d){
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getWeekDates(){
  const now=new Date();
  // ローカル日付のみ（時刻なし）で今日を作る
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const dow=today.getDay(); // 0=日,1=月,...
  const daysToMon=dow===0?-6:1-dow;
  const result=[];
  for(let i=0;i<7;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+daysToMon+weekOffset*7+i);
    result.push(d);
  }
  return result;
}

function renderAssign(){
  const dates=getWeekDates();
  const strs=dates.map(d=>localDateStr(d));
  const td=todayStr();
  const el=document.getElementById('assignBoard');

  const active=tasks.filter(t=>!t.complete);

    `${s.getMonth()+1}/${s.getDate()} ～ ${e.getMonth()+1}/${e.getDate()}`;

  if(!fieldWorkers.length){bannerEl.innerHTML='';el.innerHTML='<div class="empty"><div class="empty-icon">👷</div>先に設定から作業員を登録してください</div>';return;}

  bannerEl.innerHTML='';

  // ヘッダー行
  const headerCols=dates.map((d,i)=>{
    const ds=strs[i];
    const isToday=ds===td;
    const isSat=i===5,isSun=i===6;

      ${d.getMonth()+1}/${d.getDate()}<br>(${DAY_NAMES[i]})
    </th>`;
  }).join('');

  // 現場行
  const siteRows=active.map(t=>{
    const cells=strs.map((ds,i)=>{
      const isSat=i===5,isSun=i===6;
      const cellBg=isSun?'#fff9f9':isSat?'#f0f7ff':'';
      const asgList=assignments.filter(a=>a.task_id===t.id&&a.date===ds);
      const chips=asgList.map(a=>{

      }).join('');
      const wids=asgList.map(a=>a.worker_id);
      return`<td style="vertical-align:top;padding:5px 4px;${cellBg?'background:'+cellBg+';':''}border:1px solid var(--border);cursor:pointer" onclick="openCellAssign(${t.id},'${ds}',event)">
        ${chips}
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:3px">
          <span style="font-size:10px;color:${asgList.length?'#2563eb':'var(--border)'}">${asgList.length?asgList.length+'名':''}</span>
          ${asgList.length?`<button style="font-size:10px;padding:1px 5px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;white-space:nowrap" onclick="event.stopPropagation();openWorklogFromAssign(${t.id},'${ds}',[${wids.join(',')}])">日報</button>`:''}
        </div>
      </td>`;
    }).join('');
    return`<tr>
      <td style="font-size:12px;font-weight:700;padding:6px 8px;border:1px solid var(--border);background:var(--surface2);white-space:nowrap;min-width:70px;vertical-align:middle">
        ${t.nameMain}${t.nameSub?`<div style="font-weight:400;color:var(--text-muted);font-size:10px">${t.nameSub}</div>`:''}
      </td>${cells}
    </tr>`;
  }).join('');

  // 未配置行
  const unassignedCells=strs.map((ds,i)=>{
    const isSat=i===5,isSun=i===6;
    const cellBg=isSun?'#fff9f9':isSat?'#f0f7ff':'';
    const assignedIds=new Set(assignments.filter(a=>a.date===ds).map(a=>a.worker_id));
    const uws=fieldWorkers.filter(w=>!assignedIds.has(w.id));
    return`<td style="vertical-align:top;padding:5px 4px;${cellBg?'background:'+cellBg+';':''}border:1px solid var(--border)">
      ${uws.map(w=>`<span style="display:inline-block;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:11px;padding:1px 5px;margin:1px;white-space:nowrap">${w.name}</span>`).join('')}
      <div style="text-align:right;font-size:10px;color:${uws.length?'#dc2626':'var(--border)'};margin-top:2px">${uws.length?uws.length+'名':''}</div>
    </td>`;
  }).join('');

  el.innerHTML=`<table style="min-width:560px;border-collapse:collapse;font-size:12px">
    <thead>
      <tr>
        <th style="background:var(--surface2);padding:6px 8px;border:1px solid var(--border);font-size:11px;min-width:70px"></th>

      ${siteRows}

        <td style="font-size:12px;font-weight:700;padding:6px 8px;border:1px solid var(--border);background:#fff5f5;color:#dc2626;white-space:nowrap;vertical-align:middle">未配置</td>
        ${unassignedCells}
      </tr>
    </tbody>
  </table>`;
}

async function toggleAssignCell(wid){

async function toggleAssign(tid,wid,date,asgId){
  if(asgId){
    const{error}=await sb.from('field_assignments').delete().eq('id',asgId);

    assignments=assignments.filter(a=>a.id!==asgId);

    const{data,error}=await sb.from('field_assignments').insert({task_id:tid,worker_id:wid,date,note:''}).select().single();

  if(editingWrkId){
    const{error}=await sb.from('field_workers').update(payload).eq('id',editingWrkId);
    if(error){alert('エラー: '+error.message);return;}
    const idx=fieldWorkers.findIndex(w=>w.id===editingWrkId);
    fieldWorkers[idx]={...fieldWorkers[idx],...payload};
  }else{
    const{data,error}=await sb.from('field_workers').insert(payload).select().single();
    if(error){alert('エラー: '+error.message);return;}
    fieldWorkers.push(data);
    fieldWorkers.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  }
  closeModal('workerModal');flash();renderWorkers();populateSelects();
}

async function deleteWorker(id){
  if(!confirm('この作業員を削除しますか？'))return;
  const{error}=await sb.from('field_workers').delete().eq('id',id);
  if(error){alert('エラー: '+error.message);return;}
  fieldWorkers=fieldWorkers.filter(w=>w.id!==id);
  flash();renderWorkers();populateSelects();
}


// ── UI ──
function showPage(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});});

let flashTimer;
function flash(msg='保存しました'){
  const el=document.getElementById('flash');el.textContent=msg;el.style.display='block';
  clearTimeout(flashTimer);flashTimer=setTimeout(()=>el.style.display='none',2000);
}
function showLoading(){let el=document.getElementById('ld');if(!el){el=document.createElement('div');el.id='ld';el.style.cssText='position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:13px;z-index:9998;box-shadow:0 4px 16px rgba(0,0,0,.1)';el.textContent='読み込み中…';document.body.appendChild(el);}el.style.display='block';}
function hideLoading(){const el=document.getElementById('ld');if(el)el.style.display='none';}

// 初期ヒント
if(!localStorage.getItem(PW_KEY))document.getElementById('lockHint').textContent=`初期パスワード: ${PW_DEFAULT}`;
</script>
