<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイシン工業 管理システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maishin-theme.css">
<link rel="stylesheet" href="maishin-entrance.css">
<style>
:root{
  --bg:var(--ms-navy-deep);
  --muted:var(--ms-muted-on-navy);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:28px 16px 40px;
  color:var(--text);
}

/* メイン（ログイン画面は maishin-entrance.css） */
#app{display:none;position:relative;z-index:1;width:100%;}
.container{width:100%;max-width:760px;margin:0 auto;text-align:center;}
.logo{margin-bottom:28px;}
.home-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.24em;
  color:var(--muted);margin-bottom:8px;
}
.logo-main{
  font-size:clamp(26px,5vw,32px);font-weight:800;
  letter-spacing:.04em;color:#fff;
}
.logo-divider{
  width:48px;height:2px;margin:14px auto 12px;
  background:rgba(255,255,255,.35);
  border-radius:99px;
}
.logo-sub{font-size:13px;color:var(--muted);font-weight:500;}
.cards{display:flex;flex-direction:column;gap:10px;}
@media (min-width:640px){
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
}
.app-card{
  position:relative;
  background:#fff;
  border:2px solid var(--ms-navy-border);
  border-radius:14px;padding:18px 18px 18px 20px;
  text-decoration:none;display:flex;align-items:center;gap:16px;
  transition:transform .18s ease,border-color .18s,box-shadow .18s;
  cursor:pointer;text-align:left;
}
.app-card:hover{
  border-color:var(--ms-accent);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(11,18,32,.18);
}
.app-card:active{transform:translateY(0);}
.app-icon{
  font-size:26px;flex-shrink:0;width:52px;height:52px;
  background:var(--ms-surface2);
  border:1.5px solid var(--ms-navy-border);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
}
.app-info{flex:1;min-width:0;}
.app-name{font-size:16px;font-weight:700;color:var(--ms-text);margin-bottom:3px;}
.app-desc{font-size:12px;color:var(--ms-text-muted);line-height:1.45;}
.app-arrow{
  flex-shrink:0;width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--ms-text-muted);
  background:var(--ms-surface2);
  border:1.5px solid var(--ms-navy-border);
  transition:background .18s,color .18s,border-color .18s,transform .18s;
}
.app-card:hover .app-arrow{
  color:#fff;background:var(--ms-accent);
  border-color:var(--ms-accent);
  transform:translateX(2px);
}
.footer{margin-top:28px;font-size:11px;color:var(--ms-muted-on-navy);letter-spacing:.04em;}
</style>
</head>
<body>

<script src="auth-gate.js"></script>
<script>
function showMain(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('lockInput').value='';
  document.getElementById('lockError').textContent='';
}

async function tryUnlock(){
  const inp=document.getElementById('lockInput');
  const ok=await MaishinAuth.tryUnlock(
    ()=>inp.value,
    ()=>{
      showMain();
      if(MaishinAuth.needsInitialSetup()){
        document.getElementById('lockHint').textContent='初回ログイン後は「パスワード変更」で独自のパスワードにしてください。';
      }
    },
    (msg)=>{
      document.getElementById('lockError').textContent=msg;
      inp.classList.remove('error');
      void inp.offsetWidth;
      inp.classList.add('error');
    }
  );
  if(ok) inp.classList.remove('error');
}

function togglePw(){
  const i=document.getElementById('lockInput'),b=document.getElementById('eyeBtn');
  if(i.type==='password'){i.type='text';b.textContent='🙈';}
  else{i.type='password';b.textContent='👁';}
}

if(MaishinAuth.isSessionValid()){
  showMain();
}else if(MaishinAuth.needsInitialSetup()){
  document.getElementById('lockHint').textContent='初期設定のパスワードは管理者からお受け取りください。ログイン後に変更をおすすめします。';
}
</script>
