<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイシン工業 管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#14532d 50%,#0f172a 100%);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

/* ロック画面 */
#lockScreen{
  position:fixed;inset:0;
  background:linear-gradient(135deg,#0f172a 0%,#14532d 50%,#0f172a 100%);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
}
.lock-card{
  background:#fff;border-radius:20px;padding:40px 32px;
  width:340px;max-width:90vw;
  box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;
}
.lock-logo{font-size:22px;font-weight:800;color:#16a34a;margin-bottom:4px;}
.lock-sub{font-size:12px;color:#64748b;margin-bottom:24px;}
.lock-input-wrap{position:relative;margin-bottom:8px;}
.lock-input-wrap input{
  width:100%;padding:12px 44px 12px 16px;
  border:2px solid #e2e8f0;border-radius:10px;
  font-size:16px;outline:none;transition:border-color .2s;
}
.lock-input-wrap input:focus{border-color:#16a34a;}
.lock-input-wrap input.error{border-color:#ef4444;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.eye-btn{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:18px;cursor:pointer;color:#64748b;
}
#lockError{color:#ef4444;font-size:12px;min-height:18px;margin-bottom:8px;}
.lock-btn{
  width:100%;padding:12px;background:#16a34a;color:#fff;
  border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  transition:background .15s;
}
.lock-btn:hover{background:#15803d;}
#lockHint{font-size:11px;color:#94a3b8;margin-top:10px;}

/* メインコンテンツ */
#app{display:none;}
.container{width:100%;max-width:560px;text-align:center;}
.logo{margin-bottom:40px;}
.logo-main{font-size:28px;font-weight:800;color:#fff;letter-spacing:.02em;}
.logo-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:4px;}
.cards{display:flex;flex-direction:column;gap:16px;}
.app-card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;padding:28px 24px;
  text-decoration:none;display:flex;align-items:center;gap:20px;
  transition:all .2s;cursor:pointer;text-align:left;
}
.app-card:hover{
  background:rgba(255,255,255,.13);
  border-color:rgba(255,255,255,.3);
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,.3);
}
.app-icon{
  font-size:40px;flex-shrink:0;width:64px;height:64px;
  background:rgba(255,255,255,.1);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
}
.app-info{flex:1;}
.app-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px;}
.app-desc{font-size:13px;color:rgba(255,255,255,.55);line-height:1.5;}
.app-arrow{font-size:20px;color:rgba(255,255,255,.3);flex-shrink:0;}
.footer{margin-top:32px;font-size:12px;color:rgba(255,255,255,.25);}
</style>
</head>
<body>

<!-- ロック画面 -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">🏭 マイシン工業</div>
    <div class="lock-sub">管理システム</div>
    <div class="lock-input-wrap">
      <input type="password" id="lockInput" placeholder="パスワード" onkeydown="if(event.key==='Enter')tryUnlock()">
      <button class="eye-btn" id="eyeBtn" onclick="togglePw()">👁</button>
    </div>
    <div id="lockError"></div>
    <button class="lock-btn" onclick="tryUnlock()">ログイン</button>
    <div id="lockHint"></div>
  </div>
</div>

<!-- メイン -->
<div id="app">
  <div class="container">
    <div class="logo">
      <div class="logo-main">🏭 マイシン工業</div>
      <div class="logo-sub">管理システム</div>
    </div>
    <div class="cards">
      <a class="app-card" href="genba.html">
        <div class="app-icon">🏗️</div>
        <div class="app-info">
          <div class="app-name">現場管理</div>
          <div class="app-desc">現場一覧・作業配置・日報集計・原価管理</div>
        </div>
        <div class="app-arrow">›</div>
      </a>
      <a class="app-card" href="index_39.html">
        <div class="app-icon">⚙️</div>
        <div class="app-info">
          <div class="app-name">加工管理</div>
          <div class="app-desc">加工指示・進捗管理・タスク管理</div>
        </div>
        <div class="app-arrow">›</div>
      </a>
    </div>
    <div class="footer">マイシン工業 © 2025</div>
  </div>
</div>

<script>
const PW_KEY='genba_pw';
const PW_DEFAULT='1234';
let lockFailCount=0,lockUntil=0;

function hashPw(pw){let h=0;for(let i=0;i<pw.length;i++){h=Math.imul(31,h)+pw.charCodeAt(i)|0;}return h.toString(36)+'_'+pw.length;}
function getStoredHash(){return localStorage.getItem(PW_KEY)||hashPw(PW_DEFAULT);}

function tryUnlock(){
  const now=Date.now();
  if(lockUntil>now){
    document.getElementById('lockError').textContent=`ロック中。${Math.ceil((lockUntil-now)/1000)}秒後に再試行`;
    return;
  }
  const pw=document.getElementById('lockInput').value;
  if(!pw){document.getElementById('lockError').textContent='パスワードを入力してください';return;}
  const inp=document.getElementById('lockInput');
  if(hashPw(pw)===getStoredHash()){
    lockFailCount=0;
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('lockInput').value='';
    document.getElementById('lockError').textContent='';
  }else{
    lockFailCount++;
    inp.classList.remove('error');
    void inp.offsetWidth;
    inp.classList.add('error');
    if(lockFailCount>=5){
      lockUntil=Date.now()+30000;
      document.getElementById('lockError').textContent='試行回数超過。30秒後に再試行してください。';
    }else{
      document.getElementById('lockError').textContent=`パスワードが違います（残り${5-lockFailCount}回）`;
    }
  }
}

function togglePw(){
  const i=document.getElementById('lockInput'),b=document.getElementById('eyeBtn');
  if(i.type==='password'){i.type='text';b.textContent='🙈';}
  else{i.type='password';b.textContent='👁';}
}

if(!localStorage.getItem(PW_KEY)){
  document.getElementById('lockHint').textContent=`初期パスワード: ${PW_DEFAULT}`;
}
</script>
</body>
</html>
