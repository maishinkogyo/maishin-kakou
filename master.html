<!DOCTYPE html><html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイシン工業 マスタ管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-gate.js"></script>
<script src="js/maishin-supabase.js"></script>
<script src="maishin-nav.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="maishin-theme.css">
<link rel="stylesheet" href="maishin-entrance.css">
<style>
/* 配色は maishin-theme.css */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}

#app{display:block;}
.layout{display:flex;min-height:100vh;}
/* サイドメニュー: maishin-theme.css (.ms-sidebar) */
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:none;background:none;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);text-align:left;}
.main-content{margin-left:var(--sidebar-w);flex:1;padding:24px;max-width:1100px;}

.page-title{font-size:20px;font-weight:700;margin-bottom:20px;}

.master-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border);}
.master-tab{padding:12px 20px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-muted);border:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;background:none;font-family:inherit;}
.master-tab:hover{color:var(--text);}
.master-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.master-panel{display:none;}
.master-panel.active{display:block;}

.card{background:var(--surface);border:1.5px solid var(--ms-navy-border);border-radius:12px;padding:16px;margin-bottom:12px;}
.card-title{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}

.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:space-between;}
.spacer{flex:1;}
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--ms-accent-hover);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-danger{background:#fee2e2;color:var(--danger);border:1px solid #fca5a5;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
.form-group label{font-size:12px;font-weight:600;color:var(--text-muted);}
.form-group input,.form-group select,.form-group textarea{padding:8px 12px;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color .2s;background:var(--surface);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;border-bottom:2px solid var(--border);}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}

.empty{text-align:center;padding:40px;color:var(--text-muted);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:8px;}

#flash{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;z-index:9000;display:none;box-shadow:0 4px 16px rgba(0,0,0,.15);}

@media(max-width:640px){
  :root{--sidebar-w:0px;}
  .sidebar{display:none;}
  .main-content{margin-left:0;padding:16px;}
}
</style>
</head>
<body class="maishin-auth-pending ms-theme">
<script>MaishinAuth.bootPage();</script>

<script>
// Data arrays
let workers=[], materials=[], vehicles=[], accessories=[], buyers=[];
let nextWorkerId=1, nextMatId=1, nextVehId=1, nextAccId=1, nextBuyerId=1;
let currentAccessorySpecs=[];

const STORAGE_KEY='masterAppData';

// Load data on init
async function initApp(){
  try{
    const[w,m,v,a,b]=await Promise.all([
      sb.from('workers_list').select('*').order('sort_order'),
      sb.from('materials').select('*').order('id'),
      sb.from('vehicles').select('*'),
      sb.from('accessories').select('*'),
      sb.from('buyers').select('*')
    ]);
    workers=(w.data||[]).map(r=>({id:r.id,name:r.name,is_kakou:r.is_kakou||false,is_genba:r.is_genba||false,hourly_wage:r.hourly_wage||0,hire_date:r.hire_date||'',affiliation:r.affiliation||''}));
    materials=(m.data||[]).map(r=>({id:r.id,name:r.name,note:r.note||''}));
    vehicles=(v.data||[]).map(r=>({id:r.id,name:r.name,type:r.type||'',plate:r.plate||'',inspection:r.inspection||'',inspection_place:r.inspection_place||'',note:r.note||''}));
    accessories=(a.data||[]).map(r=>({id:r.id,name:r.name,note:r.note||''}));
    buyers=(b.data||[]).map(r=>({id:r.id,name:r.name,unit_price:r.unit_price||0}));
    nextWorkerId=workers.length?Math.max(...workers.map(x=>x.id))+1:1;
    nextMatId=materials.length?Math.max(...materials.map(x=>x.id))+1:1;
    nextVehId=vehicles.length?Math.max(...vehicles.map(x=>x.id))+1:1;
    nextAccId=accessories.length?Math.max(...accessories.map(x=>x.id))+1:1;
    nextBuyerId=buyers.length?Math.max(...buyers.map(x=>x.id))+1:1;
  }catch(e){console.warn('Supabase load error:',e);}
  renderAll();
}

function switchMasterTab(tab){
  document.querySelectorAll('.master-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('[data-master-tab]').forEach(b=>{
    b.classList.toggle('active',b.dataset.masterTab===tab);
  });
  const panel=document.getElementById('master-'+tab);
  if(panel)panel.classList.add('active');
}
function showMasterPdfMenu(){
  if(typeof MaishinPdfMenu==='undefined'){alert('PDFメニューを読み込めませんでした。');return;}
  const tabs=[
    ['workers','👤 従業員マスタ'],
    ['materials','🔩 材料マスタ'],
    ['vehicles','🚗 車両マスタ'],
    ['accessories','📦 付属品マスタ'],
    ['buyers','🏢 販売先マスタ'],
  ];
  MaishinPdfMenu.openMenu({
    items:tabs.map(([tab,label])=>({
      label,
      meta:'A4 縦',
      onClick:()=>printMasterPdf(tab),
    })),
  });
}
function printMasterPdf(tab){
  switchMasterTab(tab);
  const css=`
    @media print{
    @page{size:A4;margin:12mm;}
    .ms-sidebar,#maishinAuthGate,#flash{display:none!important;}
    .main-content{margin:0!important;padding:12px!important;max-width:none!important;}
    .master-tabs{display:none!important;}
    .master-panel{display:none!important;}
    #master-${tab}{display:block!important;}
    }
  `;
  MaishinPdfMenu.runBrowserPrint(()=>css);
}

function initMaishinSideNavMaster(){
  const el=document.getElementById('maishinSideNavItems');
  if(el&&typeof MaishinNav!=='undefined'){
    MaishinNav.renderNav(el,{activeId:'master'});
  }
}

function formatHireDate(){
  const input=document.getElementById('workerHireDate').value.trim();
  if(!input)return;
  let formatted=input;
  if(/^\d{8}$/.test(input)){
    formatted=input.slice(0,4)+'-'+input.slice(4,6)+'-'+input.slice(6,8);
  }
  document.getElementById('workerHireDate').value=formatted;
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

// WORKERS
function calculateYearsMonths(hireDate){
  if(!hireDate)return'-';
  const today=new Date(),hire=new Date(hireDate);
  let years=today.getFullYear()-hire.getFullYear(),months=today.getMonth()-hire.getMonth();
  if(months<0){years--;months+=12;}
  return`${years}年${months}ヶ月`;
}
function renderWorkers(){
  const list=document.getElementById('workerList');
  if(!workers.length){list.innerHTML='<div class="empty"><div class="empty-icon">👤</div>従業員が登録されていません</div>';return;}
  const sortedWorkers=[...workers].sort((a,b)=>{
    const dateA=new Date(a.hire_date||'9999-12-31');
    const dateB=new Date(b.hire_date||'9999-12-31');
    return dateA-dateB;
  });
  list.innerHTML='<table class="data-table"><thead><tr><th>氏名</th><th>所属</th><th>時給</th><th>入社日</th><th>勤続年数</th><th>操作</th></tr></thead><tbody>'+sortedWorkers.map(w=>{
    const yearsOfService=calculateYearsMonths(w.hire_date);
    return`<tr><td>${w.name}</td><td>${w.affiliation||'-'}</td><td>${w.hourly_wage||'-'}</td><td>${w.hire_date||'-'}</td><td>${yearsOfService}</td><td><button class="btn btn-secondary btn-sm" onclick="editWorker(${w.id})">編集</button> <button class="btn btn-danger btn-sm" onclick="deleteWorker(${w.id})">削除</button></td></tr>`;
  }).join('')+'</tbody></table>';
}
function openWorkerModal(id=null){
  const w=id?workers.find(x=>x.id===id):null;
  document.getElementById('workerId').value=id||'';
  document.getElementById('workerName').value=w?w.name:'';
  document.getElementById('workerHourlyWage').value=w?w.hourly_wage:'';
  document.getElementById('workerHireDate').value=w?w.hire_date:'';
  document.querySelectorAll('input[name="workerAffiliation"]').forEach(r=>r.checked=false);
  if(w&&w.affiliation){
    const radio=document.querySelector(`input[name="workerAffiliation"][value="${w.affiliation}"]`);
    if(radio)radio.checked=true;
  }
  document.getElementById('workerModalTitle').textContent=id?'従業員編集':'従業員追加';
  openModal('workerModal');
}
async function saveWorker(){
  const id=Number(document.getElementById('workerId').value);
  const name=document.getElementById('workerName').value.trim();
  const hourly_wage=Number(document.getElementById('workerHourlyWage').value)||0;
  const hire_date=document.getElementById('workerHireDate').value;
  const affiliationRadio=document.querySelector('input[name="workerAffiliation"]:checked');
  const affiliation=affiliationRadio?affiliationRadio.value:'';
  const is_genba=true;
  const is_kakou=affiliation==='加工';
  if(!name){alert('氏名を入力してください');return;}
  try{
    if(id){
      const{error}=await sb.from('workers_list').update({name,is_kakou,is_genba,hourly_wage,hire_date,affiliation}).eq('id',id);
      if(error)throw error;
      const w=workers.find(x=>x.id===id);
      Object.assign(w,{name,is_kakou,is_genba,hourly_wage,hire_date,affiliation});
    }else{
      const{error}=await sb.from('workers_list').insert({id:nextWorkerId,name,is_kakou,is_genba,hourly_wage,hire_date,affiliation});
      if(error)throw error;
      workers.push({id:nextWorkerId,name,is_kakou,is_genba,hourly_wage,hire_date,affiliation});
      nextWorkerId++;
    }
    closeModal('workerModal');
    flash();
    renderWorkers();
  }catch(e){
    console.error('保存失敗:',e);
    alert('保存に失敗しました:\n'+e.message);
  }
}
function editWorker(id){openWorkerModal(id);}
async function deleteWorker(id){
  if(!confirm('削除しますか？'))return;
  try{
    const{error}=await sb.from('workers_list').delete().eq('id',id);
    if(error)throw error;
    workers=workers.filter(w=>w.id!==id);
    flash();
    renderWorkers();
  }catch(e){
    console.error('削除失敗:',e);

// ACCESSORIES
function renderAccessories(){
  const list=document.getElementById('accessoryList');
  if(!accessories.length){list.innerHTML='<div class="empty"><div class="empty-icon">📦</div>付属品が登録されていません</div>';return;}
  list.innerHTML='<table class="data-table"><thead><tr><th>付属品名</th><th>仕様</th><th>操作</th></tr></thead><tbody>'+accessories.map(a=>{
    let specs=[];
    try{specs=JSON.parse(a.note);}catch{if(a.note)specs=[a.note];}
    return`<tr><td>${a.name}</td><td>${specs.join(', ')||'-'}</td><td><button class="btn btn-secondary btn-sm" onclick="editAccessory(${a.id})">編集</button> <button class="btn btn-danger btn-sm" onclick="deleteAccessory(${a.id})">削除</button></td></tr>`;
  }).join('')+'</tbody></table>';
}
function openAccessoryModal(id=null){
  const a=id?accessories.find(x=>x.id===id):null;
  document.getElementById('accessoryId').value=id||'';
  document.getElementById('accessoryName').value=a?a.name:'';
  document.getElementById('accessorySpec').value='';
  currentAccessorySpecs=[];
  if(a&&a.note){try{currentAccessorySpecs=JSON.parse(a.note);}catch{if(a.note)currentAccessorySpecs=[a.note];}}
  renderAccessorySpecs();
  document.getElementById('accessoryModalTitle').textContent=id?'付属品編集':'付属品追加';
  openModal('accessoryModal');
}
function renderAccessorySpecs(){
  const cont=document.getElementById('accessorySpecs');
  cont.innerHTML=currentAccessorySpecs.map((s,i)=>`<span class="chip">${s}<span class="chip-remove" onclick="removeAccessorySpec(${i})">✕</span></span>`).join('');
}
function addAccessorySpec(){
  const spec=document.getElementById('accessorySpec').value.trim();
  if(!spec)return;
  currentAccessorySpecs.push(spec);
  document.getElementById('accessorySpec').value='';
  renderAccessorySpecs();
}
function removeAccessorySpec(i){
  currentAccessorySpecs.splice(i,1);
  renderAccessorySpecs();
}
async function saveAccessory(){
  const id=Number(document.getElementById('accessoryId').value);
  const name=document.getElementById('accessoryName').value.trim();
  const note=JSON.stringify(currentAccessorySpecs);
  if(!name){alert('付属品名を入力してください');return;}
  try{
    if(id){
      const{error}=await sb.from('accessories').update({name,note}).eq('id',id);
      if(error)throw error;
      const a=accessories.find(x=>x.id===id);
      a.name=name;a.note=note;
    }else{
      const{error}=await sb.from('accessories').insert({id:nextAccId,name,note});
      if(error)throw error;
      accessories.push({id:nextAccId,name,note});
      nextAccId++;
    }
    closeModal('accessoryModal');
    flash();
    renderAccessories();
  }catch(e){
    console.error('保存失敗:',e);
    alert('保存に失敗しました:\n'+e.message);
  }
}
function editAccessory(id){openAccessoryModal(id);}
async function deleteAccessory(id){
  if(!confirm('削除しますか？'))return;
  try{
    const{error}=await sb.from('accessories').delete().eq('id',id);
    if(error)throw error;
    accessories=accessories.filter(a=>a.id!==id);
    flash();
    renderAccessories();
  }catch(e){
    console.error('削除失敗:',e);
    alert('削除に失敗しました:\n'+e.message);
  }
}
